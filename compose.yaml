services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mediscan
      POSTGRES_USER: mediscan
      POSTGRES_PASSWORD: mediscan
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - static:/app/backend/staticfiles
      - media:/app/backend/media
    restart: unless-stopped

  celery:
    build:
      context: .
      target: runtime
    command: celery -A config worker -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      target: runtime
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static:/static:ro
      - media:/media:ro
    restart: unless-stopped

volumes:
  pgdata:
  static:
  media: