{% extends "base.html" %}
<!-- ===================== Универсальная страница (Page Detail) ===================== -->
<!--
  Шаблон отображения статической страницы из модели/админки (page):
  - Хлебные крошки (возврат на "Главная")
  - Заголовок страницы
  - Контент страницы с форматированием переносов строк (linebreaks)
-->

{% block title %}{{ page.title }} — Mediscan{% endblock %}

{% block content %}

<!-- --------------------- Хлебные крошки --------------------- -->
<nav class="text-sm text-slate-500 mb-4">
  <!-- Ссылка назад на главную страницу раздела pages -->
  <a href="{% url 'pages:home' %}" class="hover:text-slate-900">Главная</a>
  <span class="mx-2">/</span>
  <!-- Текущая страница (без ссылки) -->
  <span class="text-slate-700">{{ page.title }}</span>
</nav>

<!-- --------------------- Основной блок страницы --------------------- -->
<div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
  <!-- Заголовок страницы -->
  <h1 class="text-3xl font-bold text-slate-900">{{ page.title }}</h1>

  <!--
    Контент страницы:
    linebreaks — превращает переводы строк в <p> и <br>,
    чтобы текст из админки выглядел читаемо без ручной верстки.
  -->
  <div class="mt-6 prose max-w-none">
    {{ page.content|linebreaks }}
  </div>
</div>

{% endblock %}
