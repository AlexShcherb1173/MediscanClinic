<div class="flex items-center justify-between gap-3 mb-3">
  <button
    type="button"
    class="h-9 w-9 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 transition"
    hx-get="{% url 'appointments:calendar' %}?m={{ prev_m }}"
    hx-target="#calendar-wrap"
    hx-swap="innerHTML"
    hx-include="#service-select,#preferred-date,#slot-input,#id_full_name,#id_phone"
    aria-label="Предыдущий месяц"
  >
    ←
  </button>

  <div class="text-sm font-semibold text-slate-800">
    {{ year }}-{% if month < 10 %}0{% endif %}{{ month }}
  </div>

  <button
    type="button"
    class="h-9 w-9 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 transition"
    hx-get="{% url 'appointments:calendar' %}?m={{ next_m }}"
    hx-target="#calendar-wrap"
    hx-swap="innerHTML"
    hx-include="#service-select,#preferred-date,#slot-input,#id_full_name,#id_phone"
    aria-label="Следующий месяц"
  >
    →
  </button>
</div>

<div class="grid grid-cols-7 gap-2 mb-2 text-[11px] text-slate-500">
  <div class="text-center">Пн</div>
  <div class="text-center">Вт</div>
  <div class="text-center">Ср</div>
  <div class="text-center">Чт</div>
  <div class="text-center">Пт</div>
  <div class="text-center">Сб</div>
  <div class="text-center">Вс</div>
</div>

<div class="grid grid-cols-7 gap-2">
  {% for _ in blanks %}
    <div class="h-11"></div>
  {% endfor %}

  {% for d in days %}
    {% with ds=d|date:"Y-m-d" pretty=d|date:"d.m.Y" %}
      <button
        type="button"
        class="h-11 rounded-2xl border text-sm flex items-center justify-center transition
               {% if selected == ds %}
                 bg-yellow-200 border-yellow-300 font-semibold text-slate-900
               {% else %}
                 bg-white border-slate-200 hover:bg-slate-50 text-slate-900
               {% endif %}"
        title="{{ ds }}"
        onclick="window.selectDate && window.selectDate('{{ ds|escapejs }}', '{{ pretty|escapejs }}');"
      >
        {{ d|date:"d" }}
      </button>
    {% endwith %}
  {% endfor %}
</div>

<div class="mt-3 text-xs text-slate-500">
  Выберите дату — слоты обновятся автоматически.
</div>
