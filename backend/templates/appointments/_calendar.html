{# templates/appointments/_calendar.html #}

<div class="flex items-center justify-between mb-3">
  <div class="text-sm font-semibold text-slate-900">{{ month_title }}</div>
  <div class="text-xs text-slate-500">Выберите дату</div>
</div>

<div class="grid grid-cols-7 gap-2 mb-2">
  {% for w in weekdays %}
    <div class="text-[11px] font-semibold text-slate-500 text-center">{{ w }}</div>
  {% endfor %}
</div>

<div id="calendar" class="grid grid-cols-7 gap-2">
  {% for c in cells %}
    <button
      type="button"
      class="rounded-2xl border px-3 py-2 text-sm transition text-center
             {% if c.is_selected %}bg-yellow-200 border-yellow-300 font-semibold
             {% elif not c.in_month %}bg-slate-50 border-slate-100 text-slate-300
             {% else %}bg-white border-slate-200 hover:bg-slate-50{% endif %}"
      onclick="
        document.getElementById('date-input').value='{{ c.ds }}';
        document.querySelectorAll('#calendar button').forEach(b=>b.classList.remove('bg-yellow-200','border-yellow-300','font-semibold'));
        this.classList.add('bg-yellow-200','border-yellow-300','font-semibold');
        document.body.dispatchEvent(new Event('refreshSlots'));
      "
      {% if not c.in_month %}disabled{% endif %}
    >
      <div class="text-slate-900 {% if not c.in_month %}text-slate-300{% endif %}">
        {{ c.date|date:"j" }}
      </div>
    </button>
  {% endfor %}
</div>
