<div class="grid grid-cols-7 gap-2">
  {% for d in days %}
    {% with ds=d|date:"Y-m-d" %}
      <button
        type="button"
        class="rounded-2xl border px-3 py-2 text-sm transition
               {% if selected == ds %}bg-yellow-200 border-yellow-300 font-semibold{% else %}bg-white border-slate-200 hover:bg-slate-50{% endif %}"
        onclick="
          document.getElementById('date-input').value='{{ ds }}';
          document.querySelectorAll('#calendar button').forEach(b=>b.classList.remove('bg-yellow-200','border-yellow-300','font-semibold'));
          this.classList.add('bg-yellow-200','border-yellow-300','font-semibold');
          document.body.dispatchEvent(new Event('refreshSlots'));
        "
      >
        <div class="text-slate-900">{{ d|date:"d.m" }}</div>
        <div class="text-[11px] text-slate-500">{{ d|date:"D" }}</div>
      </button>
    {% endwith %}
  {% endfor %}
</div>
