<option value="">Выберите время</option>

{% for s in slots %}
  <option value="{{ s.id }}"
    {% if selected_slot|stringformat:"s" == s.id|stringformat:"s" %}selected{% endif %}>
    {{ s.starts_at|date:"H:i" }}
  </option>
{% empty %}
  <option value="" disabled>Нет доступных слотов</option>
{% endfor %}
