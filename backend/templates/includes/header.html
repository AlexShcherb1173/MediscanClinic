<!-- ===================== Header ===================== -->
<!--
  Верхняя панель сайта:
  - bg-white — белый фон
  - border-b — нижняя граница
-->
<header class="bg-white border-b border-slate-200">

  <!--
    Основной контейнер:
    - ограничение ширины (max-w-6xl)
    - центрирование (mx-auto)
    - адаптивные отступы
    - flex-раскладка с распределением элементов по краям
  -->
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-4">

    <!-- Логотип / ссылка на главную -->
    <a href="/" class="font-extrabold text-slate-900 tracking-tight">
      Mediscan
    </a>

    <!-- ===================== Блок выбора города (только lg+) ===================== -->
    <!--
      hidden lg:flex — скрыт на мобильных, отображается с lg-размера
      Отображает список доступных городов.
    -->
    <div class="hidden lg:flex items-center gap-2 text-sm">
      <span class="text-slate-500">Город:</span>

      {% if cities %}
        <!-- Список городов -->
        <div class="flex flex-wrap gap-2">
          {% for c in cities %}
            <a
              href="{% url 'set_city' c.id %}"
              class="inline-flex items-center rounded-full border px-3 py-1 text-xs font-semibold transition
                {% if current_city and current_city.id == c.id %}
                  border-blue-200 bg-blue-50 text-blue-800
                {% else %}
                  border-slate-200 bg-white text-slate-700 hover:bg-slate-50
                {% endif %}"
            >
              {{ c.name }}
            </a>
          {% endfor %}
        </div>
      {% else %}
        <!-- Если города не заданы -->
        <span class="text-slate-500 text-xs">не задан</span>
      {% endif %}
    </div>

    <!-- ===================== Навигация ===================== -->
    <nav class="flex items-center gap-3 text-sm">

      <!-- Ссылка "О компании" -->
      <a href="/page/about/" class="text-slate-700 hover:text-slate-900 font-semibold">
        О компании
      </a>

      <!-- Ссылка "Контакты" -->
      <a href="/page/contacts/" class="text-slate-700 hover:text-slate-900 font-semibold">
        Контакты
      </a>

      <!-- Блок авторизации -->
      {% if request.user.is_authenticated %}
        <!-- Кнопка "Кабинет" для авторизованного пользователя -->
        <a href="{% url 'cabinet:dashboard' %}"
           class="ml-2 inline-flex items-center justify-center rounded-full bg-yellow-400 text-blue-900 px-4 py-2 text-xs font-extrabold hover:bg-yellow-300 transition">
          Кабинет
        </a>
      {% else %}
        <!-- Кнопка "Вход" для неавторизованного пользователя -->
        <a href="{% url 'accounts:login' %}"
           class="ml-2 inline-flex items-center justify-center rounded-full border border-slate-200 px-4 py-2 text-xs font-semibold hover:bg-slate-50 transition">
          Вход
        </a>
      {% endif %}
    </nav>

  </div>
</header>
