[tool.black]
line-length = 119
target-version = ["py312"]
extend-exclude = '''
/migrations/
'''

[tool.isort]
profile = "black"
line_length = 119
skip_glob = ["**/migrations/*"]

[tool.flake8]
max-line-length = 119
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", ".venv", "migrations"]
per-file-ignores = [
  "*/migrations/*.py:E501",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = "migrations"