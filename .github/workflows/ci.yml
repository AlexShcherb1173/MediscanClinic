name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Black
        run: python -m black backend/apps backend/config --check

      - name: Isort
        run: python -m isort backend/apps backend/config --check-only

      - name: Flake8
        run: python -m flake8 backend/apps backend/config

      - name: Mypy
        run: python -m mypy backend/apps backend/config

      - name: Pytest
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: |
          cd backend
          pytest -q

  docker-lint-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build lint stage
        run: docker build . --target lint