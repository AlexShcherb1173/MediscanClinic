name: ci

on:
  pull_request:
    branches: ["develop"]
  push:
    branches: ["develop"]

permissions:
  contents: read
  packages: write

jobs:
  lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mediscan_db
          POSTGRES_USER: mediscan_user
          POSTGRES_PASSWORD: CHANGE_ME_STRONG
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mediscan_user -d mediscan_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PYTHONUNBUFFERED: "1"
      DJANGO_SETTINGS_MODULE: config.settings.dev

      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: test-secret-key
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver

      DB_NAME: mediscan_db
      DB_USER: mediscan_user
      DB_PASSWORD: CHANGE_ME_STRONG
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2

      DEFAULT_FROM_EMAIL: test@example.com
      CONTACTS_ADMIN_EMAIL: test@example.com

      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_BOT_USERNAME: ""
      TELEGRAM_ADMIN_CHAT_ID: ""
      TELEGRAM_CHAT_ID: ""
      TELEGRAM_API_URL: https://api.telegram.org

      YMAPS_API_KEY: ""
      SMS_RU_API_ID: ""
      SMS_SENDER: ""
      SMTP_BACKEND: django.core.mail.backends.locmem.EmailBackend

      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Black
        run: python -m black backend/apps backend/config --check

      - name: Isort
        run: python -m isort backend/apps backend/config --check-only

      - name: Flake8
        run: python -m flake8 backend/apps backend/config --config backend/.flake8

      - name: Mypy
        run: python -m mypy backend/apps backend/config --config-file backend/mypy.ini

      - name: Pytest
        run: |
          cd backend
          pytest -q

  docker-lint-stage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker lint stage
        run: docker build -f docker/Dockerfile . --target lint
