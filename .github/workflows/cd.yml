name: cd

on:
  push:
    branches: ["develop"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase vars
        id: vars
        run: |
          echo "owner_lc=${OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "repo_lc=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/${{ steps.vars.outputs.repo_lc }}/web:latest
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/${{ steps.vars.outputs.repo_lc }}/web:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail

            OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
            REPO_LC="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"

            APP_DIR="/opt/mediscanclinic"
            COMPOSE_FILE="docker-compose.prod.yml"

            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$USER:$USER" "$APP_DIR"
            cd "$APP_DIR"

            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "ERROR: $COMPOSE_FILE not found in $APP_DIR"
              exit 1
            fi

            if [ ! -d docker/nginx ]; then
              echo "ERROR: docker/nginx directory not found in $APP_DIR"
              exit 1
            fi

            if [ ! -f .env ]; then
              printf '%s\n' "${{ secrets.MEDISCAN_ENV }}" > .env
              echo ".env created from MEDISCAN_ENV secret"
            else
              echo ".env already exists, keeping current server file"
            fi

            # Проверяем обязательные переменные в .env
            required_vars=(
              DJANGO_SECRET_KEY
              DJANGO_SETTINGS_MODULE
              DJANGO_ALLOWED_HOSTS
              DJANGO_CSRF_TRUSTED_ORIGINS
              DB_NAME
              DB_USER
              DB_PASSWORD
              DB_HOST
              DB_PORT
              CELERY_BROKER_URL
              CELERY_RESULT_BACKEND
              APP_PORT
            )

            for var in "${required_vars[@]}"; do
              if ! grep -q "^${var}=" .env; then
                echo "ERROR: Missing required variable in .env -> ${var}"
                exit 1
              fi
            done

            echo "Required .env variables check passed"

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            export GHCR_OWNER="$OWNER_LC"
            export IMAGE_TAG="latest"

            docker compose -f "$COMPOSE_FILE" pull
            docker compose -f "$COMPOSE_FILE" up -d --remove-orphans

            docker image prune -f

            echo "Containers status:"
            docker compose -f "$COMPOSE_FILE" ps

            echo "Runtime settings check:"
            docker exec mediscanclinic-web-1 python manage.py shell -c "from django.conf import settings; print('ALLOWED_HOSTS =', settings.ALLOWED_HOSTS); print('CSRF_TRUSTED_ORIGINS =', getattr(settings, 'CSRF_TRUSTED_ORIGINS', []))"
