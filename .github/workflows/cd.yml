name: cd

on:
  push:
    branches: ["develop"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mediscanclinic/web:latest
            ghcr.io/${{ github.repository_owner }}/mediscanclinic/web:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            sudo mkdir -p /opt/mediscanclinic
            sudo chown -R $USER:$USER /opt/mediscanclinic
            cd /opt/mediscanclinic

            if [ ! -d ".git" ]; then
              git clone -b develop https://github.com/${{ github.repository_owner }}/MediscanClinic .
            else
              git fetch --all
              git checkout develop
              git pull
            fi

            # .env из секрета (многострочный секрет)
            cat > .env << 'EOF'
            ${{ secrets.MEDISCAN_ENV }}
            EOF

            # login GHCR для pull private images
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            # деплой
            export GHCR_OWNER="${{ github.repository_owner }}"
            export IMAGE_TAG="latest"

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            docker image prune -f
            docker compose -f docker-compose.prod.yml ps