services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-mediscan_db}
      POSTGRES_USER: ${DB_USER:-mediscan}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mediscan_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    image: ghcr.io/${GHCR_OWNER:-alexshcherb1173}/mediscanclinic/web:${IMAGE_TAG:-latest}
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - mediscan_static:/app/backend/staticfiles
      - mediscan_media:/app/backend/media
    restart: unless-stopped

  celery:
    image: ghcr.io/${GHCR_OWNER:-alexshcherb1173}/mediscanclinic/web:${IMAGE_TAG:-latest}
    command: celery -A config worker -l info --concurrency=1
    env_file: .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery-beat:
    image: ghcr.io/${GHCR_OWNER:-alexshcherb1173}/mediscanclinic/web:${IMAGE_TAG:-latest}
    command: celery -A config beat -l info
    env_file: .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - mediscan_static:/static:ro
      - mediscan_media:/media:ro
    restart: unless-stopped

volumes:
  mediscan_pgdata:
  mediscan_static:
  mediscan_media: