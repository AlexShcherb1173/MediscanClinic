repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=119", "--exclude=*/migrations/*"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        pass_filenames: false
        args: [ "backend/apps", "backend/config", "--config-file", "backend/mypy.ini" ]
        additional_dependencies:
          - django-stubs
          - django-environ
          - celery
          - psycopg[binary]
          - phonenumbers
          - requests
          - whitenoise
          - Pillow
          - types-requests
          - types-PyYAML
          - types-python-dateutil
          - types-reportlab
